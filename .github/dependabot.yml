version: 2
updates:
- package-ecosystem: docker
  directories:
  - /lambdas
  - /src/PLATEAU.Snap.Server
  - /src/PLATEAU.Snap.Server.Lambda
  schedule:
    interval: weekly
    day: monday
    time: '10:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 3
  groups:
    routine-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: docker-compose
  directory: /src
  schedule:
    interval: weekly
    day: monday
    time: '10:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 3
  groups:
    routine-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: '10:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 3
  groups:
    routine-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: nuget
